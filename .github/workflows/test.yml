name: Solana Merkle Airdrop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build and Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI (Agave v2.1.21)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Install Anchor CLI 0.31.1
        run: |
          sudo curl -sSfL -o /usr/local/bin/anchor https://github.com/coral-xyz/anchor/releases/download/v0.31.1/anchor-0.31.1-x86_64-unknown-linux-gnu
          sudo chmod +x /usr/local/bin/anchor
          anchor --version

      - name: Generate Solana provider keypair
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --force --outfile ~/.config/solana/id.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Merkle Airdrop Test Suite (Criteria 6, 14, 16, 17)
        run: npm run test:merkleAirdrop

      - name: Run Complete Test Suite (Criterion 17)
        run: npm test
